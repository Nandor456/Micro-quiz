<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>μC Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0b0f0e;
      --surface:  #111816;
      --border:   #1e2e28;
      --green:    #00e5a0;
      --green-dim:#00a86b;
      --red:      #ff4d6d;
      --amber:    #fbbf24;
      --text:     #d4ede6;
      --muted:    #5a7a70;
      --correct:  #052e1e;
      --wrong:    #2e0510;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Subtle grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 820px;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 700;
      color: var(--green);
      letter-spacing: -1px;
    }
    .logo span { color: var(--muted); }
    header h1 {
      font-size: 1rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── HOME SCREEN ── */
    #screen-home { animation: fadeIn .3s ease; }

    .home-intro {
      margin-bottom: 2rem;
      color: var(--muted);
      font-size: .95rem;
      line-height: 1.6;
    }

    .quiz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      transition: border-color .2s, transform .15s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .quiz-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--green);
      transform: scaleY(0);
      transform-origin: top;
      transition: transform .2s;
    }
    .quiz-card:hover {
      border-color: var(--green-dim);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,229,160,.08);
    }
    .quiz-card:hover::before { transform: scaleY(1); }

    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      color: var(--green);
      margin-bottom: .5rem;
      letter-spacing: .1em;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: .5rem;
      line-height: 1.3;
    }
    .card-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      color: var(--muted);
    }

    /* ── QUIZ SCREEN ── */
    #screen-quiz { display: none; animation: fadeIn .3s ease; }
    #screen-quiz.active { display: block; }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .quiz-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: .85rem;
      color: var(--green);
    }
    #btn-back {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: .4rem .9rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      transition: border-color .2s, color .2s;
    }
    #btn-back:hover { border-color: var(--muted); color: var(--text); }

    /* Progress bar */
    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 2rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      transition: width .4s ease;
    }
    .progress-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: .5rem;
      display: flex;
      justify-content: space-between;
    }

    /* Question card */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 1.5rem;
    }
    .question-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      color: var(--green);
      letter-spacing: .1em;
      margin-bottom: 1rem;
    }
    .question-text {
      font-size: 1.1rem;
      font-weight: 500;
      line-height: 1.6;
      color: var(--text);
    }

    /* Answers */
    .answers { display: flex; flex-direction: column; gap: .75rem; }

    .answer-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      line-height: 1.5;
      transition: border-color .15s, background .15s, transform .1s;
      display: flex;
      align-items: flex-start;
      gap: .75rem;
    }
    .answer-btn:not([disabled]):hover {
      border-color: var(--green-dim);
      background: rgba(0,229,160,.04);
      transform: translateX(3px);
    }

    .answer-letter {
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      transition: background .15s, color .15s, border-color .15s;
    }

    .answer-btn.correct {
      background: var(--correct);
      border-color: var(--green);
    }
    .answer-btn.correct .answer-letter {
      background: var(--green);
      color: var(--bg);
      border-color: var(--green);
    }

    .answer-btn.wrong {
      background: var(--wrong);
      border-color: var(--red);
    }
    .answer-btn.wrong .answer-letter {
      background: var(--red);
      color: var(--bg);
      border-color: var(--red);
    }

    .answer-btn.reveal-correct {
      border-color: var(--green-dim);
      opacity: .7;
    }

    /* Feedback */
    .feedback {
      display: none;
      padding: .9rem 1.25rem;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 500;
      margin-bottom: 1rem;
      align-items: center;
      gap: .5rem;
    }
    .feedback.show { display: flex; }
    .feedback.ok  { background: var(--correct); border: 1px solid var(--green); color: var(--green); }
    .feedback.err { background: var(--wrong);   border: 1px solid var(--red);   color: var(--red); }

    /* Next btn */
    #btn-next {
      display: none;
      width: 100%;
      background: var(--green);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      padding: .9rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    #btn-next:hover { background: var(--green-dim); transform: translateY(-1px); }
    #btn-next.show { display: block; }

    /* ── RESULT SCREEN ── */
    #screen-result { display: none; animation: fadeIn .3s ease; }
    #screen-result.active { display: block; }

    .result-header {
      text-align: center;
      padding: 2.5rem 1rem 2rem;
    }
    .result-score {
      font-family: 'JetBrains Mono', monospace;
      font-size: 4rem;
      font-weight: 700;
      color: var(--green);
      line-height: 1;
      margin-bottom: .5rem;
    }
    .result-score.fail { color: var(--red); }
    .result-score.mid  { color: var(--amber); }
    .result-pts {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .result-message {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 2rem;
    }

    .result-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }
    .btn-primary, .btn-secondary {
      padding: .75rem 1.75rem;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
    }
    .btn-primary  { background: var(--green); color: var(--bg); border: none; }
    .btn-secondary { background: none; color: var(--text); border: 1px solid var(--border); }
    .btn-primary:hover, .btn-secondary:hover { transform: translateY(-2px); opacity: .9; }

    /* Review list */
    .review-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: .8rem;
      color: var(--muted);
      letter-spacing: .1em;
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    .review-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: .75rem;
    }
    .review-item.correct-item { border-color: rgba(0,229,160,.25); }
    .review-item.wrong-item   { border-color: rgba(255,77,109,.25); }

    .review-q {
      font-size: .95rem;
      margin-bottom: .75rem;
      line-height: 1.5;
    }
    .review-answers { display: flex; flex-direction: column; gap: .4rem; }
    .review-answer {
      font-size: .85rem;
      padding: .5rem .75rem;
      border-radius: 6px;
      line-height: 1.4;
    }
    .review-answer.chosen-correct { background: var(--correct); color: var(--green); }
    .review-answer.chosen-wrong   { background: var(--wrong);   color: var(--red); }
    .review-answer.was-correct    { background: var(--correct); color: var(--green-dim); }
    .review-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: .72rem;
      float: right;
      margin-left: .5rem;
    }

    /* ── LOADING ── */
    #screen-loading {
      display: none;
      justify-content: center;
      align-items: center;
      min-height: 50vh;
    }
    #screen-loading.active { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Responsive */
    @media (max-width: 500px) {
      .quiz-grid { grid-template-columns: 1fr; }
      .result-score { font-size: 3rem; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">μ<span>C</span></div>
    <h1>Mikrokontroller &mdash; Quiz</h1>
  </header>

  <!-- HOME -->
  <div id="screen-home">
    <p class="home-intro">Válassz egy kvízt a gyakorláshoz. Minden indításkor véletlenszerű kérdéssor kerül kiválasztásra a kérdésbankból.</p>
    <div class="quiz-grid" id="quiz-grid"></div>
  </div>

  <!-- LOADING -->
  <div id="screen-loading">
    <div class="spinner"></div>
  </div>

  <!-- QUIZ -->
  <div id="screen-quiz">
    <div class="quiz-header">
      <span class="quiz-title" id="quiz-label"></span>
      <button id="btn-back">← Vissza</button>
    </div>
    <div class="progress-label">
      <span id="prog-text"></span>
      <span id="score-live"></span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

    <div class="question-card">
      <div class="question-badge" id="q-badge">KÉRDÉS</div>
      <div class="question-text" id="q-text"></div>
    </div>

    <div class="answers" id="answers"></div>

    <div class="feedback" id="feedback"></div>
    <button id="btn-next">Következő kérdés →</button>
  </div>

  <!-- RESULT -->
  <div id="screen-result">
    <div class="result-header">
      <div class="result-score" id="result-pct"></div>
      <div class="result-pts" id="result-pts"></div>
      <div class="result-message" id="result-msg"></div>
      <div class="result-actions">
        <button class="btn-primary"   id="btn-retry">↻ Újra próbálom</button>
        <button class="btn-secondary" id="btn-home-from-result">← Főoldal</button>
      </div>
    </div>
    <div class="review-title">Részletes eredmény</div>
    <div id="review-list"></div>
  </div>
</div>

<script src="quiz.js"></script>
</body>
</html>
